<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>nav pill check</title>
  <style>
    body { margin: 0; background: #888; font: 12px monospace; }
    .row { position: relative; height: 90px; overflow: hidden; margin-bottom: 4px; }
    .row iframe { width: 1280px; height: 800px; border: 0; display: block; }
    .tag { position: absolute; right: 4px; top: 4px; z-index: 9; background: #000; color: #0f0; padding: 2px 6px; }
  </style>
</head>
<body>
  <div class="row"><span class="tag" id="t1">1 dark / hover Portfolio</span><iframe id="f1"></iframe></div>
  <div class="row"><span class="tag" id="t2">2 light / hover Philosophy</span><iframe id="f2"></iframe></div>

  <script>
    const wait = ms => new Promise(r => setTimeout(r, ms));

    function load(id, page, theme) {
      localStorage.setItem('theme-preference', theme);
      const f = document.getElementById(id);
      return new Promise(res => {
        f.addEventListener('load', () => res(f), { once: true });
        f.src = page;
      });
    }

    function hover(doc, text) {
      [...doc.querySelectorAll('#navmenu > ul > li > a')]
        .find(el => el.textContent.trim() === text)
        .dispatchEvent(new PointerEvent('pointerover', { bubbles: true }));
    }

    function box(el) {
      const r = el.getBoundingClientRect();
      return { top: Math.round(r.top), h: Math.round(r.height), mid: Math.round(r.top + r.height / 2) };
    }

    function report(id, doc) {
      const header = box(doc.querySelector('#header'));
      const pill = box(doc.querySelector('#navmenu .nav-pill'));
      const toggle = box(doc.querySelector('#theme-toggle'));
      const label = box(doc.querySelector('#navmenu > ul > li > a'));
      document.getElementById(id).textContent +=
        ' | header h=' + header.h + ' mid=' + header.mid +
        ' | pill h=' + pill.h + ' mid=' + pill.mid +
        ' | circle h=' + toggle.h + ' mid=' + toggle.mid +
        ' | label mid=' + label.mid +
        ' | ALIGNED=' + (pill.mid === toggle.mid && pill.h === toggle.h);
    }

    (async () => {
      const f1 = await load('f1', '/about.html', 'dark');
      const f2 = await load('f2', '/about.html', 'light');
      await wait(800);
      hover(f1.contentDocument, 'Portfolio');
      hover(f2.contentDocument, 'Philosophy');
      await wait(1500);
      report('t1', f1.contentDocument);
      report('t2', f2.contentDocument);
      localStorage.removeItem('theme-preference');
      document.title = 'DONE';
    })();
  </script>
</body>
</html>
