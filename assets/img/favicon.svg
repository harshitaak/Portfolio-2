<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Mirrors --ink in assets/css/main.css, as literal hex: a favicon is a separate
       document, so the page's custom properties are not in scope here.
       Light oklch(20% 0 0) = #161616 ... dark oklch(92% 0 0) = #e4e4e4.

       Follows the OS theme, not the site's .light-mode class, because the tab strip
       this is painted on is coloured by the browser rather than by the page.

       This is the default the HTML link points at. The media query below only takes
       effect in Firefox — Chrome ignores it for favicons (crbug.com/1311553) and
       always paints the light-mode rule — so theme-init.js swaps the whole file for
       favicon-dark.svg when the OS is dark. Keep the two files' paths in sync. */
    path { fill: #161616; }

    @media (prefers-color-scheme: dark) {
      path { fill: #e4e4e4; }
    }
  </style>
